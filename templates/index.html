<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Горящие Ноги — Беговой Помощник</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .card-bg {
            background-color: #1e1e1e;
        }
        .accent-yellow {
            background-color: #ccff00;
            color: #000;
        }
    </style>
</head>
<body x-data="appData()" x-init="initApp()" class="p-4 max-w-md mx-auto min-h-screen pb-12">

    <!-- Заголовок -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-2">
            <template x-if="currentTab !== 'menu'">
                <button @click="currentTab = 'menu'" class="p-2 bg-gray-800 rounded-full text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
            </template>
            <h1 class="text-xl font-bold text-yellow-400" x-text="tabTitles[currentTab] || 'Горящие Ноги'"></h1>
        </div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div x-show="currentTab === 'menu'" class="space-y-3">
        <button @click="currentTab = 'timer'" class="w-full card-bg p-4 rounded-xl flex items-center justify-between border border-gray-800 hover:border-yellow-400 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg accent-yellow flex items-center justify-center text-xl font-bold">⏱️</div>
                <span class="font-medium text-lg">Интервальный таймер</span>
            </div>
            <span class="text-gray-400">›</span>
        </button>

        <button @click="currentTab = 'hr_zones'" class="w-full card-bg p-4 rounded-xl flex items-center justify-between border border-gray-800 hover:border-yellow-400 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg accent-yellow flex items-center justify-center text-xl font-bold">💓</div>
                <span class="font-medium text-lg">Пульсовые зоны</span>
            </div>
            <span class="text-gray-400">›</span>
        </button>

        <button @click="currentTab = 'dist_pace'" class="w-full card-bg p-4 rounded-xl flex items-center justify-between border border-gray-800 hover:border-yellow-400 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg accent-yellow flex items-center justify-center text-xl font-bold">📍</div>
                <span class="font-medium text-lg">Калькулятор: дистанция/темп</span>
            </div>
            <span class="text-gray-400">›</span>
        </button>

        <button @click="currentTab = 'pace_speed'" class="w-full card-bg p-4 rounded-xl flex items-center justify-between border border-gray-800 hover:border-yellow-400 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg accent-yellow flex items-center justify-center text-xl font-bold">⚡</div>
                <span class="font-medium text-lg">Калькулятор: темп/скорость</span>
            </div>
            <span class="text-gray-400">›</span>
        </button>

        <button @click="currentTab = 'shoes'" class="w-full card-bg p-4 rounded-xl flex items-center justify-between border border-gray-800 hover:border-yellow-400 transition">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg accent-yellow flex items-center justify-center text-xl font-bold">👟</div>
                <span class="font-medium text-lg">Калькулятор размера кроссовок</span>
            </div>
            <span class="text-gray-400">›</span>
        </button>
    </div>

    <!-- 1. ИНТЕРВАЛЬНЫЙ ТАЙМЕР -->
    <div x-show="currentTab === 'timer'" class="space-y-4">
        <div class="card-bg p-4 rounded-xl space-y-3">
            <div class="flex justify-between items-center">
                <span>Количество подходов:</span>
                <input type="number" x-model.number="timerSets" class="w-20 bg-gray-800 p-2 rounded text-center text-white font-bold">
            </div>
            <div class="flex justify-between items-center">
                <span>Работа (сек):</span>
                <input type="number" x-model.number="timerWork" class="w-20 bg-gray-800 p-2 rounded text-center text-white font-bold">
            </div>
            <div class="flex justify-between items-center">
                <span>Отдых (сек):</span>
                <input type="number" x-model.number="timerRest" class="w-20 bg-gray-800 p-2 rounded text-center text-white font-bold">
            </div>
        </div>

        <div class="card-bg p-6 rounded-xl text-center space-y-2">
            <div class="text-gray-400 font-semibold" x-text="timerStateText"></div>
            <div class="text-5xl font-extrabold text-yellow-400" x-text="formatSeconds(timerCurrentSeconds)"></div>
            <div class="text-sm text-gray-400">Сет: <span x-text="timerCurrentSet"></span> / <span x-text="timerSets"></span></div>
        </div>

        <button @click="toggleTimer()" class="w-full py-4 rounded-xl font-bold text-lg text-black accent-yellow" x-text="timerRunning ? 'ПАУЗА' : 'СТАРТ'"></button>
    </div>

    <!-- 2. ПУЛЬСОВЫЕ ЗОНЫ -->
    <div x-show="currentTab === 'hr_zones'" class="space-y-4">
        <div class="card-bg p-4 rounded-xl flex items-center justify-between">
            <span class="font-semibold">ЧССmax (уд/мин):</span>
            <input type="number" x-model.number="hrMax" @input="recalcHRZones()" class="w-24 bg-gray-800 p-2 rounded text-center text-yellow-400 font-bold text-xl">
        </div>

        <div class="space-y-2">
            <template x-for="z in hrZonesList" :key="z.zone">
                <div class="p-3 rounded-xl text-white font-semibold flex justify-between items-center shadow" :style="'background-color:' + z.color">
                    <div>
                        <div class="text-sm font-bold opacity-90" x-text="z.name"></div>
                        <div class="text-xl" x-text="z.min + '-' + z.max + ' уд/мин'"></div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs opacity-80">Целевой</div>
                        <div class="text-lg font-bold" x-text="z.target"></div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- 3. ДИСТАНЦИЯ / ТЕМП -->
    <div x-show="currentTab === 'dist_pace'" class="space-y-4">
        <!-- Пресеты дистанций -->
        <div class="grid grid-cols-6 gap-1">
            <button @click="setPresetDist(3)" class="bg-gray-800 p-2 rounded text-xs text-center hover:bg-yellow-400 hover:text-black">3 км</button>
            <button @click="setPresetDist(5)" class="bg-gray-800 p-2 rounded text-xs text-center hover:bg-yellow-400 hover:text-black">5 км</button>
            <button @click="setPresetDist(10)" class="bg-gray-800 p-2 rounded text-xs text-center hover:bg-yellow-400 hover:text-black">10 км</button>
            <button @click="setPresetDist(15)" class="bg-gray-800 p-2 rounded text-xs text-center hover:bg-yellow-400 hover:text-black">15 км</button>
            <button @click="setPresetDist(21.1)" class="bg-gray-800 p-2 rounded text-xs text-center hover:bg-yellow-400 hover:text-black">21.1 км</button>
            <button @click="setPresetDist(42.2)" class="bg-gray-800 p-2 rounded text-xs text-center hover:bg-yellow-400 hover:text-black">42.2 км</button>
        </div>

        <div class="card-bg p-4 rounded-xl space-y-4">
            <div>
                <label class="text-sm text-gray-400 block mb-1">Дистанция (км):</label>
                <input type="number" step="0.1" x-model.number="distPace.distance" @input="recalcDistPace('dist')" class="w-full bg-gray-800 p-3 rounded-lg text-white font-bold text-lg">
            </div>
            <div>
                <label class="text-sm text-gray-400 block mb-1">Темп (мин:сек / км):</label>
                <input type="text" placeholder="05:30" x-model="distPace.paceStr" @input="recalcDistPace('pace')" class="w-full bg-gray-800 p-3 rounded-lg text-white font-bold text-lg">
            </div>
            <div>
                <label class="text-sm text-gray-400 block mb-1">Время (ч:мин:сек):</label>
                <input type="text" placeholder="00:27:30" x-model="distPace.timeStr" @input="recalcDistPace('time')" class="w-full bg-gray-800 p-3 rounded-lg text-white font-bold text-lg">
            </div>
        </div>
    </div>

    <!-- 4. ТЕМП / СКОРОСТЬ -->
    <div x-show="currentTab === 'pace_speed'" class="space-y-4">
        <div class="card-bg p-6 rounded-xl space-y-6 text-center">
            <div>
                <label class="text-sm text-gray-400 block mb-2">Темп (мин/км)</label>
                <input type="text" x-model="paceSpeed.pace" @input="recalcPaceToSpeed()" class="w-full text-center bg-gray-800 text-yellow-400 text-3xl font-bold p-3 rounded-xl" placeholder="05:00">
            </div>
            <div class="text-2xl font-bold text-gray-500">=</div>
            <div>
                <label class="text-sm text-gray-400 block mb-2">Скорость (км/ч)</label>
                <input type="number" step="0.1" x-model.number="paceSpeed.speed" @input="recalcSpeedToPace()" class="w-full text-center bg-gray-800 text-white text-3xl font-bold p-3 rounded-xl" placeholder="12.0">
            </div>
        </div>
    </div>

    <!-- 5. РАЗМЕР КРОССОВОК -->
    <div x-show="currentTab === 'shoes'" class="space-y-4">
        <div class="flex bg-gray-800 p-1 rounded-xl">
            <button @click="shoeGender = 'man'; updateShoeSize()" :class="shoeGender === 'man' ? 'accent-yellow text-black' : 'text-gray-400'" class="flex-1 py-2 rounded-lg font-bold transition">Мужчина</button>
            <button @click="shoeGender = 'woman'; updateShoeSize()" :class="shoeGender === 'woman' ? 'accent-yellow text-black' : 'text-gray-400'" class="flex-1 py-2 rounded-lg font-bold transition">Женщина</button>
        </div>

        <div class="card-bg p-4 rounded-xl space-y-3">
            <label class="text-sm text-gray-400 block">Выберите один из параметров размера:</label>
            <div class="grid grid-cols-5 gap-2">
                <div>
                    <span class="text-xs text-gray-400 block text-center">US</span>
                    <input type="number" step="0.5" x-model.number="shoeInput.us" @input="recalcShoes('us')" class="w-full bg-gray-800 p-2 rounded text-center text-white font-bold">
                </div>
                <div>
                    <span class="text-xs text-gray-400 block text-center">UK</span>
                    <input type="number" step="0.5" x-model.number="shoeInput.uk" @input="recalcShoes('uk')" class="w-full bg-gray-800 p-2 rounded text-center text-white font-bold">
                </div>
                <div>
                    <span class="text-xs text-gray-400 block text-center">RUS</span>
                    <input type="number" step="0.5" x-model.number="shoeInput.rus" @input="recalcShoes('rus')" class="w-full bg-gray-800 p-2 rounded text-center text-white font-bold">
                </div>
                <div>
                    <span class="text-xs text-gray-400 block text-center">EUR</span>
                    <input type="number" step="0.5" x-model.number="shoeInput.eur" @input="recalcShoes('eur')" class="w-full bg-gray-800 p-2 rounded text-center text-white font-bold">
                </div>
                <div>
                    <span class="text-xs text-gray-400 block text-center">CM</span>
                    <input type="number" step="0.5" x-model.number="shoeInput.cm" @input="recalcShoes('cm')" class="w-full bg-gray-800 p-2 rounded text-center text-white font-bold">
                </div>
            </div>
        </div>
    </div>

    <script>
        function appData() {
            return {
                currentTab: 'menu',
                tabTitles: {
                    'menu': 'Горящие Ноги 🏃‍♂️',
                    'timer': 'Интервальный таймер',
                    'hr_zones': 'Пульсовые зоны',
                    'dist_pace': 'Дистанция / Темп / Время',
                    'pace_speed': 'Темп / Скорость',
                    'shoes': 'Размер кроссовок'
                },
                // HR Zones
                hrMax: 180,
                hrZonesList: [],
                
                // Dist / Pace
                distPace: { distance: 10, paceStr: '05:00', timeStr: '00:50:00' },
                
                // Pace / Speed
                paceSpeed: { pace: '05:00', speed: 12.0 },
                
                // Shoes
                shoeGender: 'man',
                shoeInput: { us: 10, uk: 9.5, rus: 42.5, eur: 44, cm: 28 },

                // Timer
                timerSets: 5,
                timerWork: 60,
                timerRest: 30,
                timerCurrentSet: 1,
                timerCurrentSeconds: 60,
                timerRunning: false,
                timerStateText: 'ГОТОВ',
                timerInterval: null,
                timerIsWorkPhase: true,

                initApp() {
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.ready();
                        window.Telegram.WebApp.expand();
                    }
                    this.recalcHRZones();
                },

                // Пульс
                recalcHRZones() {
                    let max = this.hrMax || 180;
                    this.hrZonesList = [
                        { zone: 1, name: 'Zone 1: Медленный бег', min: Math.round(max * 0.60), max: Math.round(max * 0.70), target: Math.round(max * 0.69), color: '#38bdf8' },
                        { zone: 2, name: 'Zone 2: Легкий темп', min: Math.round(max * 0.70), max: Math.round(max * 0.75), target: Math.round(max * 0.74), color: '#4ade80' },
                        { zone: 3, name: 'Zone 3: Темповой бег', min: Math.round(max * 0.75), max: Math.round(max * 0.85), target: Math.round(max * 0.83), color: '#facc15' },
                        { zone: 4, name: 'Zone 4: Бег на уровне ПАНО', min: Math.round(max * 0.85), max: Math.round(max * 0.95), target: Math.round(max * 0.92), color: '#fb923c' },
                        { zone: 5, name: 'Zone 5: Бег в зоне МПК', min: Math.round(max * 0.95), max: max, target: Math.round(max * 0.97), color: '#f87171' }
                    ];
                },

                // Темп <-> Скорость
                recalcPaceToSpeed() {
                    let parts = this.paceSpeed.pace.split(':');
                    if (parts.length === 2) {
                        let mins = parseInt(parts[0]) || 0;
                        let secs = parseInt(parts[1]) || 0;
                        let totalHours = (mins * 60 + secs) / 3600;
                        if (totalHours > 0) {
                            this.paceSpeed.speed = (1 / totalHours).toFixed(1);
                        }
                    }
                },

                recalcSpeedToPace() {
                    let speed = parseFloat(this.paceSpeed.speed);
                    if (speed > 0) {
                        let totalSecs = Math.round(3600 / speed);
                        let mins = Math.floor(totalSecs / 60);
                        let secs = totalSecs % 60;
                        this.paceSpeed.pace = (mins < 10 ? '0' + mins : mins) + ':' + (secs < 10 ? '0' + secs : secs);
                    }
                },

                // Пресеты
                setPresetDist(d) {
                    this.distPace.distance = d;
                    this.recalcDistPace('dist');
                },

                recalcDistPace(field) {
                    // Базовый пересчёт
                    if (field === 'dist' || field === 'pace') {
                        let parts = this.distPace.paceStr.split(':');
                        if (parts.length === 2) {
                            let paceSecs = (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0);
                            let totalSecs = Math.round(paceSecs * this.distPace.distance);
                            let h = Math.floor(totalSecs / 3600);
                            let m = Math.floor((totalSecs % 3600) / 60);
                            let s = totalSecs % 60;
                            this.distPace.timeStr = (h<10?'0'+h:h)+':'+(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);
                        }
                    }
                },

                // Обувь
                recalcShoes(field) {
                    // Конвертация размера
                },

                // Таймер
                toggleTimer() {
                    if (this.timerRunning) {
                        clearInterval(this.timerInterval);
                        this.timerRunning = false;
                    } else {
                        this.timerRunning = true;
                        this.runTimerStep();
                    }
                },

                runTimerStep() {
                    this.timerInterval = setInterval(() => {
                        if (this.timerCurrentSeconds > 1) {
                            this.timerCurrentSeconds--;
                        } else {
                            if (this.timerIsWorkPhase) {
                                this.timerIsWorkPhase = false;
                                this.timerStateText = 'ОТДЫХ';
                                this.timerCurrentSeconds = this.timerRest;
                            } else {
                                this.timerIsWorkPhase = true;
                                this.timerCurrentSet++;
                                if (this.timerCurrentSet > this.timerSets) {
                                    clearInterval(this.timerInterval);
                                    this.timerRunning = false;
                                    this.timerStateText = 'ТРЕНИРОВКА ЗАВЕРШЕНА!';
                                    return;
                                }
                                this.timerStateText = 'РАБОТА';
                                this.timerCurrentSeconds = this.timerWork;
                            }
                        }
                    }, 1000);
                },

                formatSeconds(totalSecs) {
                    let m = Math.floor(totalSecs / 60);
                    let s = totalSecs % 60;
                    return (m<10?'0'+m:m) + ':' + (s<10?'0'+s:s);
                }
            }
        }
    </script>
</body>
</html>
